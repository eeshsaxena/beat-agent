name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: "Also build the Docker image (downloads ~1.5 GB of packages and model weights)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1
          pip install torch==2.15.0 torchaudio==2.11.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install --no-deps basic-pitch==0.4.0
      - name: Lint
        run: python -m ruff check beatagent evals tests scripts testpack --line-length 120
      - name: Unit tests (fast, no model weights)
        run: python -m pytest -q tests
      - name: README numbers match the committed results
        run: python scripts/check_claims.py

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (runs scripts/setup.py inside)
        run: docker compose build
